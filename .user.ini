; PHP 8 reports "Undefined variable/array key" as E_WARNING (PHP 7.4: E_NOTICE).
; Hide warnings, notices and deprecations on the pages like before; fatal errors are still shown.
; Note: error_reporting also applies to the log, so only the remaining levels (e.g. fatal errors) are logged.
error_reporting = E_ALL & ~E_WARNING & ~E_NOTICE & ~E_DEPRECATED
log_errors = On
